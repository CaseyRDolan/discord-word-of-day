name: Discord Word of the Day

on:
  schedule:
    # GitHub cron is UTC. Running at both 16:00 and 17:00 UTC lets the
    # workflow hit noon Eastern during both daylight and standard time.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the Discord payload without posting"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  post-word:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: word-of-day-discord/package-lock.json

      - name: Install dependencies
        working-directory: word-of-day-discord
        run: npm ci

      - name: Check noon Eastern
        id: noon
        shell: bash
        run: |
          hour="$(TZ=America/New_York date +%H)"
          echo "eastern_hour=$hour" >> "$GITHUB_OUTPUT"
          if [ "$hour" = "12" ]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post word of the day
        if: github.event_name == 'workflow_dispatch' || steps.noon.outputs.should_post == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WOTD_TIMEZONE: America/New_York
          WOTD_USERNAME: Word of the Day
          WOTD_EMBED_COLOR: 3BA55D
          WOTD_SOURCE: merriam-webster
          WOTD_ALLOW_LOCAL_FALLBACK: "1"
          WOTD_INTRO_TEXT: "Wordussies, today's word has dropped."
          WOTD_CHALLENGE_TEXT: "Use **{word}** in a sentence at some point today."
          WOTD_ROLE_ID: "1503222086682808370"
          WOTD_GIF_ENABLED: "1"
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node word-of-day-discord/post-word-of-day.mjs

      - name: Skip non-noon scheduled run
        if: github.event_name == 'schedule' && steps.noon.outputs.should_post != 'true'
        run: echo "Skipping because it is not noon in America/New_York."
