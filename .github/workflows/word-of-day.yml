name: Discord Word of the Day

on:
  schedule:
    # GitHub scheduled jobs can be delayed or dropped. Try every 5 minutes
    # from noon through 2:57 PM Eastern; the daily cache prevents duplicates.
    - cron: "2/5 12-14 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the Discord payload without posting"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: discord-word-of-day
  cancel-in-progress: false

jobs:
  post-word:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get Eastern date
        id: noon
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const timeZone = "America/New_York";
          const now = new Date();
          const easternDate = formatDateKey(now, timeZone);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `eastern_date=${easternDate}`,
            "",
          ].join("\n"));

          function formatDateKey(date, tz) {
            const parts = Object.fromEntries(
              new Intl.DateTimeFormat("en-CA", {
                timeZone: tz,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              }).formatToParts(date).map((part) => [part.type, part.value]),
            );
            return `${parts.year}-${parts.month}-${parts.day}`;
          }
          EOF

      - name: Restore daily post cache
        id: daily-cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .word-of-day-posted
          key: word-of-day-${{ steps.noon.outputs.eastern_date }}

      - name: Check out repository
        if: github.event_name == 'workflow_dispatch' || steps.daily-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: github.event_name == 'workflow_dispatch' || steps.daily-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: word-of-day-discord/package-lock.json

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.daily-cache.outputs.cache-hit != 'true'
        working-directory: word-of-day-discord
        run: npm ci

      - name: Prepare daily post state
        if: github.event_name == 'workflow_dispatch' || steps.daily-cache.outputs.cache-hit != 'true'
        run: mkdir -p .word-of-day-posted

      - name: Post word of the day
        id: post
        if: github.event_name == 'workflow_dispatch' || steps.daily-cache.outputs.cache-hit != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WOTD_TIMEZONE: America/New_York
          WOTD_USERNAME: Word of the Day
          WOTD_EMBED_COLOR: 3BA55D
          WOTD_SOURCE: merriam-webster
          WOTD_ALLOW_LOCAL_FALLBACK: "1"
          WOTD_INTRO_TEXT: "Wordussies, today's word has dropped."
          WOTD_CHALLENGE_TEXT: "Use **{word}** in a sentence at some point today."
          WOTD_ROLE_ID: "1503222086682808370"
          WOTD_STATE_FILE: .word-of-day-posted/last-posted.json
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node word-of-day-discord/post-word-of-day.mjs

      - name: Save daily post cache
        if: github.event_name == 'schedule' && steps.daily-cache.outputs.cache-hit != 'true' && steps.post.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .word-of-day-posted
          key: word-of-day-${{ steps.noon.outputs.eastern_date }}

      - name: Skip already-posted scheduled run
        if: github.event_name == 'schedule' && steps.daily-cache.outputs.cache-hit == 'true'
        run: echo "Skipping because Word of the Day already posted for ${{ steps.noon.outputs.eastern_date }}."
