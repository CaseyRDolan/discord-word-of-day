name: Discord Wake Up

on:
  push:
    paths:
      - ".github/workflows/wake-up.yml"
      - "word-of-day-discord/wake-up.mjs"
  schedule:
    # Avoid :00 because GitHub can delay or drop scheduled jobs at high-load times.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without posting"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_send:
        description: "Ignore random chance and allowed hours"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Maybe send wake up
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WAKE_UP_USER_IDS: ${{ secrets.WAKE_UP_USER_IDS }}
          WAKE_UP_MESSAGE: "WAKE UP"
          WAKE_UP_DELETE_AFTER_MS: "0"
          WAKE_UP_CHANCE_PERCENT: "4"
          WAKE_UP_TIMEZONE: America/New_York
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run || 'false' }}
          FORCE_SEND: ${{ github.event_name == 'push' && 'false' || inputs.force_send || 'false' }}
        run: node word-of-day-discord/wake-up.mjs
